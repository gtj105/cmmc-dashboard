events {
  worker_connections 1024;
}

http {
  server_tokens off;

  # ─── Rate limiting zone (10k IPs, 10 req/sec burst) ───
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;

  upstream nextjs {
    server app:3000;
  }

  # ─── HTTP → HTTPS redirect ───
  server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge must remain on HTTP
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS server ───
  server {
    listen 443 ssl http2;
    server_name _;

    # ─── SSL certificates (Let's Encrypt) ───
    ssl_certificate     /etc/letsencrypt/live/cmmc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmmc/privkey.pem;

    # ─── Modern TLS config ───
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── OCSP stapling ───
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 26M;

    # ─── Security headers ───
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Login endpoint rate limiting (stricter) ───
    location /api/auth/ {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API rate limiting ───
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (no rate limit) ───
    location /api/health {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ─── All other requests ───
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
