events {
  worker_connections 1024;
}

http {
  server_tokens off;

  # ─── Rate limiting zones ───
  # Think of this like a guest list — each IP gets a limited number of visits per second
  # api: 10 requests/sec for general API calls
  # login: 3 requests/sec for authentication (stricter to slow brute force)
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=evidence:10m rate=2r/s;
  limit_req_zone $binary_remote_addr zone=backup:10m rate=1r/m;

  upstream nextjs {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 26M;

    # ─── Security headers ───
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy is set by Next.js middleware (src/middleware.ts)
    # with a per-request nonce — do not set it here.
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ─── Login + password-change endpoints: strictest rate limit ───
    # Both are credential-handling paths — 3 req/sec, burst of 5 before 429
    location /api/auth/ {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/user/password {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/practices/ {
      limit_req zone=evidence burst=3 nodelay;
      limit_req_status 429;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 26M;
    }

    location /api/admin/backup/ {
      limit_req zone=backup burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 11M;
    }

    # ─── API rate limiting ───
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (no rate limit) ───
    location /api/health {
      allow 127.0.0.1;
      allow 172.16.0.0/12;
      allow 10.0.0.0/8;
      deny all;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # ─── All other requests ───
    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
